<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NDAi preview</title>
<!--
  Stand-in for a chat site so the content script can be exercised without
  loading the extension. The composer copies ProseMirror's DOM shape
  (contenteditable root > <p> blocks) and ChatGPT's send-button selector.
  The bundle is loaded as a plain page script; with no chrome.* APIs it
  boots already activated.
-->
<style>
  :root { --bg: #f4f4f1; --panel: #fff; --ink: #1d1f20; --muted: #6a6f6c; --line: #e0e2dd; --accent: #2a4b7c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header strong { font-size: 15px; }
  header label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, .chip, .tool { font: inherit; font-size: 13px; }
  select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 280px; }
  .scenarios { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chip { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .chip[data-expect="green"] { border-left: 4px solid #3f7a52; }
  .chip[data-expect="yellow"] { border-left: 4px solid #b5761f; }
  .chip[data-expect="red"] { border-left: 4px solid #b03443; }
  .thread { display: flex; flex-direction: column; gap: 12px; }
  .msg { align-self: flex-end; max-width: 80%; background: #e7ebf2; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 13px; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(transparent, var(--bg) 30%); }
  .composer { max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 10px 12px 8px; box-shadow: 0 4px 18px rgba(0,0,0,.06); transition: max-width .2s; }
  .composer.narrow { max-width: 360px; }
  .composer.dragging { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .scroller { max-height: 168px; overflow-y: auto; }
  .ProseMirror { outline: none; min-height: 26px; padding: 2px 6px; white-space: pre-wrap; word-wrap: break-word; }
  .ProseMirror p { margin: 0; }
  .ProseMirror:empty::before, .ProseMirror.is-empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; float: left; height: 0; }
  .bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .tool { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 10px; cursor: pointer; color: var(--ink); }
  .attachments { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .file { font-size: 12px; background: #eef0ec; border-radius: 6px; padding: 3px 8px; }
  #send { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <strong>NDAi preview</strong>
  <label>Destination
    <select id="dest">
      <option value="chatgpt.com" selected>chatgpt.com (consumer)</option>
      <option value="platform.openai.com">platform.openai.com (vetted)</option>
      <option value="localhost">localhost (private model)</option>
    </select>
  </label>
  <label><input type="checkbox" id="narrow" /> Narrow composer (wrapping)</label>
</header>

<main>
  <p class="hint">Pick a scenario or type. Hover an underline for its card, click the badge in the composer for the summary, press Enter to hit the send gate. Drop a text file on the composer to test uploads.</p>
  <div class="scenarios" id="scenarios"></div>
  <div class="thread" id="thread"></div>
</main>

<div class="dock">
  <div class="composer" id="composer">
    <div class="scroller">
      <div id="prompt-textarea" class="ProseMirror is-empty" contenteditable="true" role="textbox" aria-multiline="true"
           data-placeholder="Message the assistant"><p><br class="ProseMirror-trailingBreak"></p></div>
    </div>
    <div class="bar">
      <label class="tool" title="Attach file">📎 Attach<input type="file" id="file" multiple hidden /></label>
      <button class="tool" type="button" data-sample="env">+ sample .env</button>
      <button class="tool" type="button" data-sample="memo">+ sample memo.md</button>
      <button class="tool" type="button" data-sample="pdf">+ sample board-memo.pdf</button>
      <div class="attachments" id="attachments"></div>
      <button id="send" data-testid="send-button" aria-label="Send prompt" type="button">↑</button>
    </div>
  </div>
</div>

<script>
  // Prompts taken from demo_seed.py, plus a clean one and a mixed long one.
  const SCENARIOS = [
    ["green", "Public question", "What is a Z-factor and why is 0.5 the usual cutoff for a screening assay?"],
    ["red", "Credential", "Here is my env file, why does the connection fail: DATABASE_URL=postgresql://kestrel:8fh39dkw0slq@db.internal:5432/compounds"],
    ["yellow", "Cohort four (t2)", "Cohort four dosing started this week, testing the intermittent schedule proposed after cohort three: three days on, two days off, versus the continuous dosing used in cohorts one through three."],
    ["yellow", "Commercial reorg (t2)", "We are splitting the commercial team into two pods: enterprise accounts running the autoloader, and self-serve registry API customers on the per-seat plan. Tighten this."],
    ["red", "Acquisition (t3)", "We are thinking about buying a microfluidics company for just under four hundred million, mostly cash with some stock, and holding back some of it because of a patent fight. What should the board be asking?"],
    ["red", "Pricing move (t3)", "Next year we want to stop charging per seat and start charging per plate when the autoloader goes generally available. Draft the internal note."],
    ["red", "Tox results, multi-line", "Can you summarise this for the team?\nHepatotoxicity appears above 12 mg/kg. Three of eight animals in the high dose arm showed ALT elevation beyond three times the upper limit of normal, and the effect was dose dependent rather than idiosyncratic.\nAlso my key for the eval script is sk-proj4f8a9b2c7d1e6f0a3b5c8d9e and my email is priya@kestrelbio.com."],
  ];

  const editor = document.getElementById("prompt-textarea");
  const thread = document.getElementById("thread");
  const attachments = document.getElementById("attachments");
  const fileInput = document.getElementById("file");
  const composer = document.getElementById("composer");
  const root = document.documentElement;

  document.execCommand("defaultParagraphSeparator", false, "p");
  root.dataset.ndaiDestination = document.getElementById("dest").value;
  document.getElementById("dest").addEventListener("change", (e) => {
    root.dataset.ndaiDestination = e.target.value;
    // Nudge a re-check: re-insert the same text as a normal edit.
    const text = editor.innerText.trim();
    if (text) setPrompt(text);
  });
  document.getElementById("narrow").addEventListener("change", (e) => composer.classList.toggle("narrow", e.target.checked));

  const syncEmpty = () => editor.classList.toggle("is-empty", !editor.innerText.trim());
  editor.addEventListener("input", syncEmpty);

  function setPrompt(text) {
    editor.focus();
    const range = document.createRange();
    range.selectNodeContents(editor);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand("insertText", false, text); // same path a person typing/pasting takes
    syncEmpty();
  }

  const box = document.getElementById("scenarios");
  SCENARIOS.forEach(([expect, label, text], i) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.expect = expect;
    b.textContent = label;
    b.onclick = () => setPrompt(text);
    box.append(b);
  });

  function addMessage(text, bot) {
    const m = document.createElement("div");
    m.className = bot ? "msg bot" : "msg";
    m.textContent = text;
    thread.append(m);
    m.scrollIntoView({ block: "end" });
  }

  function send() {
    const text = editor.innerText.trim();
    if (!text && !attachments.children.length) return;
    const files = [...attachments.children].map((c) => c.textContent);
    addMessage(text + (files.length ? `\n\n📎 ${files.join(", ")}` : ""));
    editor.innerHTML = '<p><br class="ProseMirror-trailingBreak"></p>';
    attachments.replaceChildren();
    syncEmpty();
    setTimeout(() => addMessage("(assistant reply would appear here)", true), 300);
  }

  // Host-page handlers, registered normally. NDAi's capture-phase listeners run first.
  document.getElementById("send").addEventListener("click", send);
  editor.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  function showFiles(list) {
    for (const f of list) {
      const chip = document.createElement("span");
      chip.className = "file";
      chip.textContent = f.name;
      attachments.append(chip);
    }
  }
  fileInput.addEventListener("change", () => { showFiles(fileInput.files); fileInput.value = ""; });

  composer.addEventListener("dragover", (e) => { e.preventDefault(); composer.classList.add("dragging"); });
  composer.addEventListener("dragleave", () => composer.classList.remove("dragging"));
  composer.addEventListener("drop", (e) => {
    e.preventDefault();
    composer.classList.remove("dragging");
    showFiles(e.dataTransfer.files);
  });

  const SAMPLES = {
    env: ["prod.env", "text/plain", "DATABASE_URL=postgresql://kestrel:8fh39dkw0slq@db.internal:5432/compounds\nOPENAI_API_KEY=sk-proj4f8a9b2c7d1e6f0a3b5c8d9e\nLOG_LEVEL=info\n"],
    memo: ["board-prep.md", "text/markdown", "# Board prep\n\nWe are thinking about buying a microfluidics company for just under four hundred million, mostly cash with some stock.\n\nCohort four dosing started this week, testing the intermittent schedule proposed after cohort three: three days on, two days off, versus the continuous dosing used in cohorts one through three.\n"],
    // Any PDF works: the mock sanitizer ignores its contents. Needs `npm run preview` (fetch doesn't work on file://).
    pdf: ["board-memo.pdf", "application/pdf", () => fetch("samples/board-memo.pdf").then((r) => r.arrayBuffer())],
  };
  // Synthetic attach: sets input.files and fires change, exactly what a real pick produces.
  document.querySelectorAll("[data-sample]").forEach((b) => b.addEventListener("click", async () => {
    const [name, type, body] = SAMPLES[b.dataset.sample];
    const dt = new DataTransfer();
    dt.items.add(new File([typeof body === "function" ? await body() : body], name, { type }));
    fileInput.files = dt.files;
    fileInput.dispatchEvent(new Event("change", { bubbles: true }));
  }));

  const initial = Number(new URLSearchParams(location.search).get("scenario"));
  if (initial && SCENARIOS[initial - 1]) setTimeout(() => setPrompt(SCENARIOS[initial - 1][2]), 50);
</script>
<script src="../dist/content_script.js"></script>
</body>
</html>
