<!doctype html>
<meta charset="utf-8" />
<style>
  body { width: 280px; margin: 0; padding: 16px; background: #f2f3f0; color: #1b2021;
         font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .status { font-size: 12px; color: #6b716d; margin-bottom: 14px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .up { background: #3f6b4e; } .down { background: #8e2f3a; } .warn { background: #b5761f; }
  label { display: block; margin-bottom: 10px; }
  input, select { width: 100%; font: inherit; padding: 5px 7px; margin-top: 3px;
                  border: 1px solid #c9cdc7; border-radius: 2px; background: #fbfbf9; }
  .row { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .row input { width: auto; margin: 0; }
  .note { font-size: 11.5px; color: #6b716d; border-top: 1px solid #dcdfd9; padding-top: 10px; }
</style>
<h1>ndAI</h1>
<div class="status" id="status"><span class="dot warn"></span>Checking local service</div>
<label>Signed in as<input id="user" placeholder="you@company.com" /></label>
<label>Role<select id="role">
  <option value="researcher">Researcher</option>
  <option value="engineer">Engineer</option>
  <option value="contractor">Contractor</option>
  <option value="default">Other</option>
</select></label>
<div class="row"><input type="checkbox" id="enabled" /><span>Check what I send</span></div>
<div class="row"><input type="checkbox" id="failClosed" /><span>Block if the service is down</span></div>
<div class="note" id="note"></div>
<script src="popup.js"></script>
