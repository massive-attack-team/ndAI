# ndAI policy. Edited by security, not by engineers.
# Risk is not a property of the text alone:
#   risk = sensitivity x destination x who is sending it

destinations:
  # Runs inside our network or under a contract with no retention.
  private_local:
    - localhost
    - ollama.internal
    - llm.kestrelbio.internal
  # Vetted vendor, enterprise agreement, zero-retention endpoint.
  enterprise_vetted:
    - console.anthropic.com
    - platform.openai.com
    - bedrock.aws.amazon.com
  # Consumer web products. Personal accounts are common here.
  public_consumer:
    - chatgpt.com
    - chat.openai.com
    - claude.ai
    - gemini.google.com
    - copilot.microsoft.com
    - perplexity.ai
  # Anything not listed resolves to "unknown" and is treated as public_consumer
  # plus one step stricter.

roles:
  researcher: {clearance: 3}
  engineer: {clearance: 2}
  contractor: {clearance: 1}
  default: {clearance: 2}

# Declared membership, the way an identity provider would supply it. The
# context graph adds up what a whole team has sent, so a document leaked a
# piece per person is still one document. Never inferred from prompts.
teams:
  finance: [dana@kestrelbio.com, alex@kestrelbio.com]
  research: [priya@kestrelbio.com]
  platform: [sam@kestrelbio.com]

# Sensitivity tiers: 0 public, 1 internal, 2 confidential, 3 restricted.
# First matching rule wins. Order matters.
rules:
  - name: credentials never leave
    when: {has_critical_secret: true}
    then: block
    message: A live credential was found in this text. Rotate it if it has already been sent anywhere.

  - name: weak signal, unconfirmed
    when: {confidence: [weak], min_sensitivity: 2}
    then: warn
    message: Reads like it could be sensitive material, but there's no confirmed match to internal documents. Logged for review rather than blocked on a guess.

  - name: restricted to unknown destination
    when: {min_sensitivity: 3, destinations: [unknown, public_consumer]}
    then: block
    message: Restricted material cannot go to a consumer AI product. Use the internal model, or ask for an exception.

  # Confidence "cumulative" comes from the context stage: no single prompt was
  # enough, but together with what this person or their team already sent to
  # the same kind of destination, enough of one internal document is out.
  # Sanitize first (CONTRACT.md #9 review). Sits BELOW the restricted rule on
  # purpose: rules are first match, so above it tier 3 would be sanitized too.
  # Tier 3 pieced together blocks; tier 2 gets a verified rewrite attempt.
  - name: pieced together across prompts
    when: {confidence: [cumulative], min_sensitivity: 2, destinations: [public_consumer, unknown]}
    then: sanitize
    message: Earlier prompts already sent parts of this internal document to consumer AI, and this one adds more. Sending a minimum-context version instead - if that isn't possible, this gets blocked instead.

  - name: restricted to vetted vendor
    when: {min_sensitivity: 3, destinations: [enterprise_vetted]}
    then: sanitize
    message: Restricted material. Sending a minimum-context version instead.

  - name: confidential to consumer AI
    when: {min_sensitivity: 2, destinations: [public_consumer, unknown]}
    then: sanitize
    message: This looks like internal material. Sending a minimum-context version instead.

  - name: confidential to vetted vendor
    when: {min_sensitivity: 2, destinations: [enterprise_vetted]}
    then: warn
    message: Confidential, but the destination is covered by an enterprise agreement. Logged.

  - name: contractor sending anything internal
    when: {min_sensitivity: 1, roles: [contractor]}
    then: warn
    message: Contractor account. Internal material is logged for review.

  - name: internal to private model
    when: {min_sensitivity: 1, destinations: [private_local]}
    then: allow
    message: Stays on the network.

  - name: default
    when: {}
    then: allow
    message: Nothing sensitive detected.
